<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="메가메디칼 하지원 사원">
    <meta property="og:description" content="영업기획팀 하지원입니다.">
    <meta property="og:image" content="https://www.megamedical.co.kr/img/common/logo.png">

    <title>Mega Medical - Jiwon Ha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        :root {
            --brand-orange: #F15A24;
            --brand-blue: #004C97;
            --theme-color: #F15A24;
            --theme-bg: #f3f4f6;
            --theme-card: #ffffff;
            --theme-text: #333333;
            --theme-sub: #64748b;
            --theme-rgb: 241, 90, 36;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--theme-bg);
            color: var(--theme-text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* FEVER MODE 애니메이션 */
        @keyframes fever-bg {
            0% { background-color: #ff0000; }
            20% { background-color: #ff00ff; }
            40% { background-color: #0000ff; }
            60% { background-color: #00ffff; }
            80% { background-color: #00ff00; }
            100% { background-color: #ffff00; }
        }
        .fever-mode { animation: fever-bg 0.5s infinite; }
        .fever-mode .card-container { transform: scale(1.05) rotate(1deg); filter: hue-rotate(90deg); }

        .card-container {
            width: 100%;
            max-width: 380px;
            background-color: var(--theme-card);
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            position: relative;
            border: 1px solid rgba(0,0,0,0.05);
            z-index: 10;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .profile-header {
            background-color: transparent;
            padding: 60px 24px 60px;
            text-align: right;
            position: relative;
            border-bottom: 6px solid var(--theme-color);
            transition: border-color 0.5s ease;
        }

        .logo-box { display: flex; flex-direction: column; align-items: flex-end; transition: all 0.3s ease; }
        .logo-box.clickable { cursor: pointer; }
        .logo-top { color: var(--theme-color); font-weight: 900; font-size: 1.8rem; line-height: 1; transition: color 0.5s; }
        .logo-bottom { color: var(--brand-blue); font-weight: 700; font-size: 0.8rem; letter-spacing: 2px; margin-top: 2px; transition: color 0.5s; }

        .siren-mode .logo-bottom { color: #818CF8; }
        .siren-mode .logo-top { color: #ffffff; }
        .doro-mode .logo-bottom { color: #FF85A1; }
        .crown-mode .logo-bottom { color: #C5A059; }

        .avatar-circle {
            position: absolute;
            bottom: -45px;
            left: 24px;
            width: 95px;
            height: 95px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid var(--theme-color);
            overflow: hidden;
            transition: all 0.5s ease;
            z-index: 20;
        }

        #profile-img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .avatar-initial { font-size: 2.2rem; font-weight: 800; color: var(--theme-color); transition: color 0.5s; }

        .content { padding: 65px 24px 35px; }

        .brand-btn {
            background-color: var(--theme-color);
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .soft-item { 
            background: rgba(var(--theme-rgb), 0.05); 
            border: 1px solid rgba(var(--theme-rgb), 0.1); 
            transition: all 0.3s ease; 
        }

        .theme-icon { color: var(--theme-color); transition: color 0.5s; }
        .theme-text { color: var(--theme-color); transition: color 0.5s; }

        .lang-switch {
            position: absolute;
            top: 25px;
            left: 24px;
            background: rgba(0,0,0,0.05);
            padding: 4px;
            border-radius: 50px;
            display: flex;
            z-index: 50;
        }
        .lang-btn {
            font-size: 10px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
        }
        .lang-btn.active { background: white; color: var(--theme-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        #easter-egg-container {
            position: fixed;
            bottom: -200px;
            right: 20px;
            width: 110px;
            height: 110px;
            z-index: 100;
            transition: bottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }
        #easter-egg-container.show { bottom: 25px; }
        #easter-egg-container img { width: 100%; height: 100%; object-fit: cover; border-radius: 1.5rem; border: 4px solid white; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }

        .hidden-triggers {
            margin-top: 2.5rem;
            display: flex;
            justify-content: center;
            gap: 25px;
            opacity: 0.05; 
        }
        .trigger-dot { width: 12px; height: 12px; background: #000; border-radius: 50%; cursor: pointer; transition: transform 0.2s; }
        .trigger-dot:hover { transform: scale(1.5); }

        #toast {
            visibility: hidden;
            min-width: 240px;
            background-color: rgba(30, 41, 59, 0.9);
            color: white;
            text-align: center;
            border-radius: 50px;
            padding: 12px 24px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            font-size: 13px;
            backdrop-filter: blur(5px);
        }
        #toast.show { visibility: visible; animation: fadein 0.4s, fadeout 0.4s 2.6s; }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body onclick="hideEasterEgg()">

    <script>
        function handleImageError() {
            const img = document.getElementById('profile-img');
            const initial = document.getElementById('profile-initial');
            console.log("Image load failed. Showing initials.");
            if (img) img.style.display = 'none';
            if (initial) initial.style.display = 'block';
        }
    </script>

    <div id="easter-egg-container">
        <img id="egg-img" src="" alt="Easter Egg">
    </div>

    <div class="card-container mx-4" onclick="event.stopPropagation()">
        <div class="lang-switch">
            <div id="btn-ko" class="lang-btn active" onclick="setLang('ko')">KR</div>
            <div id="btn-en" class="lang-btn" onclick="setLang('en')">EN</div>
        </div>

        <div class="profile-header">
            <div id="logo-box" class="logo-box" onclick="checkLogoReset()">
                <span class="logo-top">mega</span>
                <span class="logo-bottom">MEDICAL</span>
            </div>
            <div class="avatar-circle">
                <img id="profile-img" src="" alt="Profile" onerror="handleImageError()">
                <span id="profile-initial" class="avatar-initial">JW</span>
            </div>
        </div>

        <div class="content">
            <div class="mb-10">
                <h1 class="text-3xl font-extrabold flex flex-wrap items-baseline gap-2">
                    <span id="name-main">하지원</span>
                    <span id="name-sub" class="text-lg font-normal opacity-40">Jiwon Ha</span>
                </h1>
                <p id="job-title" class="text-sm font-bold mt-1 theme-text">
                    영업기획팀 | 사원
                </p>
                <div class="h-1.5 w-10 mt-4 rounded-full" style="background-color: var(--theme-color);" id="accent-bar"></div>
            </div>

            <div class="space-y-4 mb-10">
                <button onclick="downloadVCard()" class="w-full brand-btn py-4.5 rounded-2xl font-bold flex items-center justify-center gap-3 text-lg h-14">
                    <i class="fa-solid fa-address-book"></i> 
                    <span id="btn-text">연락처 저장하기</span>
                </button>
                
                <div class="grid grid-cols-2 gap-3">
                    <a href="tel:01000000000" class="soft-item py-4 rounded-2xl flex flex-col items-center justify-center gap-1 group">
                        <i class="fa-solid fa-phone text-xl group-hover:scale-110 transition-transform theme-icon"></i>
                        <span id="label-mobile" class="text-[10px] font-bold opacity-60">휴대폰 (KR)</span>
                    </a>
                    <a href="mailto:jwha@megamedical.co.kr" class="soft-item py-4 rounded-2xl flex flex-col items-center justify-center gap-1 group">
                        <i class="fa-solid fa-envelope text-xl group-hover:scale-110 transition-transform theme-icon"></i>
                        <span id="label-email" class="text-[10px] font-bold opacity-60">이메일</span>
                    </a>
                </div>
            </div>

            <div class="p-5 rounded-3xl mb-8 transition-all" style="background: rgba(var(--theme-rgb), 0.03); border: 1px solid rgba(var(--theme-rgb), 0.1);" id="address-box">
                <div class="px-2 py-1 rounded text-[9px] font-black mb-2 inline-block theme-icon" style="background: rgba(var(--theme-rgb), 0.1);">HEADQUARTERS SEOUL</div>
                <p class="text-sm font-bold mb-1">서울본사</p>
                <p id="address-text" class="text-[11px] opacity-60 leading-relaxed">서울특별시 강남구 봉은사로 439 (CC빌딩 5층)</p>
            </div>

            <div class="hidden-triggers">
                <div class="trigger-dot" onclick="triggerEasterEgg('doro')"></div>
                <div class="trigger-dot" onclick="triggerEasterEgg('siren')"></div>
                <div class="trigger-dot" onclick="triggerEasterEgg('crown')"></div>
                <div class="trigger-dot" id="fever-trigger" onclick="feverClick()"></div>
            </div>

            <div class="mt-8 text-center">
                <p class="text-[9px] tracking-[0.3em] uppercase font-bold opacity-30">We Do Your ENT / Mega Medical</p>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let currentLang = 'ko';
        let isSpecialMode = false;
        let feverCount = 0;
        
        const getCacheBuster = () => "?v=" + Date.now();
        const GITHUB_BASE = "https://raw.githubusercontent.com/hajwmg/nfc-zoayoo/main/";
        
        const IMAGES = {
            doro: GITHUB_BASE + "DORO.jfif", 
            siren: GITHUB_BASE + "siren.jfif",
            crown: GITHUB_BASE + "crown.jfif"
        };

        const TRANSLATIONS = {
            ko: {
                nameMain: "하지원",
                nameSub: "Jiwon Ha",
                job: "영업기획팀 | 사원",
                btn: "연락처 저장하기",
                mobile: "휴대폰 (KR)",
                email: "이메일",
                address: "서울특별시 강남구 봉은사로 439 (CC빌딩 5층)",
                reset: "기본 테마로 초기화되었습니다."
            },
            en: {
                nameMain: "Jiwon Ha",
                nameSub: "",
                job: "Sales Planning Team | Staff",
                btn: "Save Contact",
                mobile: "Mobile (KR)",
                email: "Email",
                address: "5F, CC Building, 439, Bongeunsa-ro, Gangnam-gu, Seoul, Korea",
                reset: "Theme Reset Successfully."
            }
        };

        function setLang(lang) {
            if (window.event) window.event.stopPropagation();
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            const t = TRANSLATIONS[lang];
            document.getElementById('name-main').textContent = t.nameMain;
            document.getElementById('name-sub').textContent = t.nameSub;
            document.getElementById('job-title').textContent = t.job;
            document.getElementById('btn-text').textContent = t.btn;
            document.getElementById('label-mobile').textContent = t.mobile;
            document.getElementById('label-email').textContent = t.email;
            document.getElementById('address-text').textContent = t.address;
        }

        function triggerEasterEgg(type) {
            if (window.event) window.event.stopPropagation();
            const body = document.body;
            const eggImg = document.getElementById('egg-img');
            const profileImg = document.getElementById('profile-img');
            const logoBox = document.getElementById('logo-box');
            const buster = getCacheBuster();

            isSpecialMode = true;
            logoBox.classList.add('clickable');
            
            body.classList.remove('siren-mode', 'crown-mode', 'doro-mode');
            body.classList.add(`${type}-mode`);
            
            const targetImg = IMAGES[type] + buster;
            
            // 프로필 이미지를 즉시 변경
            profileImg.src = targetImg;
            eggImg.src = targetImg;

            profileImg.onload = function() {
                profileImg.style.display = 'block';
                document.getElementById('profile-initial').style.display = 'none';
            };
            
            document.getElementById('easter-egg-container').classList.add('show');
            showToast(`${type.toUpperCase()} 테마가 적용되었습니다!`);
            
            // 축하 효과 (Confetti)
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: [getComputedStyle(document.documentElement).getPropertyValue('--theme-color')]
            });
        }

        function feverClick() {
            feverCount++;
            if(feverCount >= 5) {
                startFeverMode();
                feverCount = 0;
            } else {
                showToast(`FEVER 로딩 중... (${feverCount}/5)`);
            }
        }

        function startFeverMode() {
            const body = document.body;
            body.classList.add('fever-mode');
            showToast("🔥 FEVER MODE ACTIVATED! 🔥");
            
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
              const timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                clearInterval(interval);
                body.classList.remove('fever-mode');
                return;
              }

              const particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function checkLogoReset() {
            if (isSpecialMode) resetTheme();
        }

        function resetTheme() {
            isSpecialMode = false;
            const body = document.body;
            const logoBox = document.getElementById('logo-box');
            const profileImg = document.getElementById('profile-img');
            const initial = document.getElementById('profile-initial');

            body.classList.remove('siren-mode', 'crown-mode', 'doro-mode', 'fever-mode');
            logoBox.classList.remove('clickable');
            
            profileImg.style.display = 'none';
            initial.style.display = 'block';
            
            document.getElementById('easter-egg-container').classList.remove('show');
            showToast(TRANSLATIONS[currentLang].reset);
        }

        function hideEasterEgg() {
            document.getElementById('easter-egg-container').classList.remove('show');
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 3000);
        }

        function downloadVCard() {
            const vCardData = [
                "BEGIN:VCARD", "VERSION:3.0",
                "N;CHARSET=UTF-8:하;지원;;;",
                "FN;CHARSET=UTF-8:하지원 (Jiwon Ha)",
                "ORG;CHARSET=UTF-8:(주)메가메디칼",
                "TITLE;CHARSET=UTF-8:영업기획팀 사원",
                "TEL;TYPE=CELL:010-0000-0000",
                "EMAIL:jwha@megamedical.co.kr",
                "ADR;TYPE=WORK;CHARSET=UTF-8:;;서울특별시 강남구 봉은사로 439 (CC빌딩 5층);;;;",
                "END:VCARD"
            ].join("\r\n");
            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'Jiwon_Ha_MegaMedical.vcf';
            a.click();
        }
    </script>
</body>
</html>
