<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="영업기획팀 하지원입니다.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="메가메디칼 하지원 사원">
  <meta property="og:description" content="영업기획팀 하지원입니다.">
  <meta property="og:image" content="https://www.megamedical.co.kr/img/common/logo.png">
  <title>Mega Medical - Jiwon Ha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://hajwmg.github.io/nfc-card/card.css?v=20260617">
</head>
<body>
  <main id="business-card" class="card-shell" data-card-id="nfc-me">
    <section class="profile-card" aria-label="Business card">
      <header class="card-header">
        <div class="language-switch" aria-label="Language">
          <button type="button" class="active" data-lang="ko">KR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <div class="brand-mark" aria-label="Mega Medical">
          <span id="brand-top" class="brand-top">mega</span>
          <span id="brand-bottom" class="brand-bottom">MEDICAL</span>
        </div>
        <div class="avatar" aria-hidden="true">
          <img id="profile-photo" src="" alt="">
          <span id="initials">JW</span>
        </div>
      </header>

      <div class="card-content">
        <div class="identity">
          <div class="name-line">
            <h1 id="name-main">하지원</h1>
            <span id="name-sub">Jiwon Ha</span>
          </div>
          <p class="role">
            <span id="role-department">영업기획팀</span>
            <strong>| <span id="role-position">사원</span></strong>
          </p>
          <div class="accent-line" aria-hidden="true"></div>
        </div>

        <button id="save-contact" type="button" class="primary-action">
          <i class="fa-solid fa-address-book" aria-hidden="true"></i>
          <span id="save-label">연락처 저장하기</span>
        </button>

        <div class="quick-actions">
          <a id="phone-link" class="quick-action" href="tel:01000000000">
            <i class="fa-solid fa-phone" aria-hidden="true"></i>
            <span id="mobile-label">Mobile</span>
          </a>
          <a id="email-link" class="quick-action" href="mailto:jwha@megamedical.co.kr">
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            <span id="email-label">Email</span>
          </a>
        </div>

        <div id="link-list">
          <a class="link-card" href="https://www.megamedical.co.kr" target="_blank" rel="noopener">
            <div>
              <p class="eyebrow">website</p>
              <p class="link-title">메가메디칼 공식 홈페이지</p>
            </div>
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
          </a>
        </div>

        <section class="office-card" aria-label="Office location">
          <p class="eyebrow">Office Location</p>
          <p id="office-title" class="office-title">본사 (Seoul HQ)</p>
          <p id="office-address" class="office-address">서울특별시 강남구 봉은사로 439 (CC빌딩 5층)</p>
        </section>

        <p id="footer-note" class="footer-note">We Do Your ENT / Mega Medical</p>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://hajwmg.github.io/nfc-card/card.js?v=20260617" defer></script>
</body>
</html>
