<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="메가메디칼 하지원 사원">
    <meta property="og:description" content="영업기획팀 하지원입니다.">
    <meta property="og:image" content="https://www.megamedical.co.kr/img/common/logo.png">

    <title>Mega Medical - Jiwon Ha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        :root {
            --brand-orange: #F15A24;
            --brand-blue: #004C97;
            --theme-color: #F15A24;
            --theme-bg: #f3f4f6;
            --theme-card: #ffffff;
            --theme-text: #333333;
            --theme-sub: #64748b;
            --theme-rgb: 241, 90, 36;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--theme-bg);
            color: var(--theme-text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.5s ease;
        }

        .card-container {
            width: 100%;
            max-width: 380px;
            background-color: var(--theme-card);
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            position: relative;
            border: 1px solid rgba(0,0,0,0.05);
            z-index: 10;
        }

        .profile-header {
            background-color: transparent;
            padding: 60px 24px 60px;
            text-align: right;
            position: relative;
            border-bottom: 6px solid var(--theme-color);
            transition: border-color 0.4s ease;
        }

        .logo-box { display: flex; flex-direction: column; align-items: flex-end; }
        .logo-box.clickable { cursor: pointer; }
        .logo-top { color: var(--theme-color); font-weight: 900; font-size: 1.8rem; line-height: 1; transition: color 0.4s; }
        .logo-bottom { color: var(--brand-blue); font-weight: 700; font-size: 0.8rem; letter-spacing: 2px; margin-top: 2px; transition: color 0.4s; }

        .avatar-circle {
            position: absolute;
            bottom: -45px;
            left: 24px;
            width: 95px;
            height: 95px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid var(--theme-color);
            overflow: hidden;
            transition: all 0.4s ease;
            z-index: 20;
        }

        #profile-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: none; 
        }
        .avatar-initial { 
            font-size: 2.2rem; 
            font-weight: 800; 
            color: var(--theme-color); 
            display: block; 
        }

        .content { padding: 65px 24px 35px; }

        .brand-btn {
            background-color: var(--theme-color);
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2);
        }

        .soft-item { 
            background: rgba(var(--theme-rgb), 0.05); 
            border: 1px solid rgba(var(--theme-rgb), 0.1); 
        }

        .theme-icon { color: var(--theme-color); transition: color 0.4s; }
        .theme-text { color: var(--theme-color); transition: color 0.4s; }

        .lang-switch {
            position: absolute;
            top: 25px;
            left: 24px;
            background: rgba(0,0,0,0.05);
            padding: 4px;
            border-radius: 50px;
            display: flex;
            z-index: 50;
        }
        .lang-btn {
            font-size: 10px;
            font-weight: 800;
            padding: 5px 12px;
            border-radius: 50px;
            cursor: pointer;
        }
        .lang-btn.active { background: white; color: var(--theme-color); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        .hidden-triggers {
            margin-top: 2.5rem;
            display: flex;
            justify-content: center;
            gap: 25px;
            opacity: 0.1; 
        }
        .trigger-dot { width: 12px; height: 12px; background: #000; border-radius: 50%; cursor: pointer; }

        #toast {
            visibility: hidden;
            min-width: 240px;
            background-color: rgba(30, 41, 59, 0.95);
            color: white;
            text-align: center;
            border-radius: 50px;
            padding: 12px 24px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%);
            font-size: 13px;
        }
        #toast.show { visibility: visible; animation: fadein 0.4s, fadeout 0.4s 2.6s; }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        /* 테마별 모드 */
        .siren-mode { --theme-color: #818CF8; --theme-bg: #020617; --theme-card: #0F172A; --theme-text: #F8FAFC; --theme-rgb: 129, 140, 248; }
        .doro-mode { --theme-color: #FF85A1; --theme-bg: #FFF5F7; --theme-card: #ffffff; --theme-text: #4A1D1F; --theme-rgb: 255, 133, 161; }
        .crown-mode { --theme-color: #C5A059; --theme-bg: #E7E5E4; --theme-card: #ffffff; --theme-text: #1C1917; --theme-rgb: 197, 160, 89; }
    </style>
</head>
<body>

    <div class="card-container mx-4">
        <div class="lang-switch">
            <div id="btn-ko" class="lang-btn active" onclick="setLang('ko')">KR</div>
            <div id="btn-en" class="lang-btn" onclick="setLang('en')">EN</div>
        </div>

        <div class="profile-header">
            <div id="logo-box" class="logo-box" onclick="resetTheme()">
                <span class="logo-top">mega</span>
                <span class="logo-bottom">MEDICAL</span>
            </div>
            <div class="avatar-circle">
                <!-- 이미지가 있으면 이걸 보여줌 -->
                <img id="profile-img" src="" alt="Profile">
                <!-- 이미지가 없거나 로딩 실패하면 이걸 보여줌 -->
                <span id="profile-initial" class="avatar-initial">JW</span>
            </div>
        </div>

        <div class="content">
            <div class="mb-10">
                <h1 class="text-3xl font-extrabold flex flex-wrap items-baseline gap-2">
                    <span id="name-main">하지원</span>
                    <span id="name-sub" class="text-lg font-normal opacity-40">Jiwon Ha</span>
                </h1>
                <p id="job-title" class="text-sm font-bold mt-1 theme-text">
                    영업기획팀 | 사원
                </p>
                <div class="h-1.5 w-10 mt-4 rounded-full" style="background-color: var(--theme-color);" id="accent-bar"></div>
            </div>

            <div class="space-y-4 mb-10">
                <button onclick="downloadVCard()" class="w-full brand-btn py-4.5 rounded-2xl font-bold flex items-center justify-center gap-3 text-lg h-14">
                    <i class="fa-solid fa-address-book"></i> 
                    <span id="btn-text">연락처 저장하기</span>
                </button>
                
                <div class="grid grid-cols-2 gap-3">
                    <a href="tel:01000000000" class="soft-item py-4 rounded-2xl flex flex-col items-center justify-center gap-1 group">
                        <i class="fa-solid fa-phone text-xl theme-icon"></i>
                        <span id="label-mobile" class="text-[10px] font-bold opacity-60">휴대폰 (KR)</span>
                    </a>
                    <a href="mailto:jwha@megamedical.co.kr" class="soft-item py-4 rounded-2xl flex flex-col items-center justify-center gap-1 group">
                        <i class="fa-solid fa-envelope text-xl theme-icon"></i>
                        <span id="label-email" class="text-[10px] font-bold opacity-60">이메일</span>
                    </a>
                </div>
            </div>

            <div class="p-5 rounded-3xl mb-8" style="background: rgba(var(--theme-rgb), 0.03); border: 1px solid rgba(var(--theme-rgb), 0.1);">
                <div class="px-2 py-1 rounded text-[9px] font-black mb-2 inline-block theme-icon" style="background: rgba(var(--theme-rgb), 0.1);">HEADQUARTERS SEOUL</div>
                <p class="text-sm font-bold mb-1">서울본사</p>
                <p id="address-text" class="text-[11px] opacity-60 leading-relaxed">서울특별시 강남구 봉은사로 439 (CC빌딩 5층)</p>
            </div>

            <!-- 테마를 바꾸는 숨겨진 버튼들 (하단 투명 영역) -->
            <div class="hidden-triggers">
                <div class="trigger-dot" onclick="applyTheme('doro')"></div>
                <div class="trigger-dot" onclick="applyTheme('siren')"></div>
                <div class="trigger-dot" onclick="applyTheme('crown')"></div>
            </div>

            <div class="mt-8 text-center">
                <p class="text-[9px] tracking-[0.3em] uppercase font-bold opacity-30">We Do Your ENT / Mega Medical</p>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        let currentLang = 'ko';
        // 깃허브 주소 확인
        const GITHUB_BASE = "https://raw.githubusercontent.com/hajwmg/nfc-zoayoo/main/";
        
        // 파일 정보 (대소문자 주의!)
        const THEME_FILES = {
            doro: { name: "DORO", exts: ["jpg", "jfif", "JPG", "JFIF"] },
            siren: { name: "siren", exts: ["jpg", "jfif", "JPG", "JFIF"] },
            crown: { name: "crown", exts: ["jpg", "jfif", "JPG", "JFIF"] }
        };

        const TRANSLATIONS = {
            ko: {
                nameMain: "하지원", nameSub: "Jiwon Ha", job: "영업기획팀 | 사원",
                btn: "연락처 저장하기", mobile: "휴대폰 (KR)", email: "이메일",
                address: "서울특별시 강남구 봉은사로 439 (CC빌딩 5층)", reset: "기본 테마로 돌아왔습니다."
            },
            en: {
                nameMain: "Jiwon Ha", nameSub: "", job: "Sales Planning Team | Staff",
                btn: "Save Contact", mobile: "Mobile (KR)", email: "Email",
                address: "5F, CC Building, 439, Bongeunsa-ro, Gangnam-gu, Seoul, Korea", reset: "Theme reset."
            }
        };

        // 이미지를 찾을 때까지 모든 확장자를 돌려보는 로직
        async function fetchImage(type) {
            const file = THEME_FILES[type];
            const imgEl = document.getElementById('profile-img');
            const initialEl = document.getElementById('profile-initial');
            
            // 시도할 때마다 랜덤 숫자를 붙여 캐시 방지
            const cacheBuster = `?v=${new Date().getTime()}`;

            for (let ext of file.exts) {
                const url = `${GITHUB_BASE}${file.name}.${ext}${cacheBuster}`;
                
                const isFound = await new Promise((resolve) => {
                    const testImg = new Image();
                    testImg.onload = () => resolve(true);
                    testImg.onerror = () => resolve(false);
                    testImg.src = url;
                });

                if (isFound) {
                    imgEl.src = url;
                    imgEl.style.display = 'block';
                    initialEl.style.display = 'none';
                    return; // 이미지를 찾으면 종료
                }
            }
            
            // 끝내 못 찾으면 이니셜 표시
            imgEl.style.display = 'none';
            initialEl.style.display = 'block';
        }

        function applyTheme(type) {
            document.body.classList.remove('siren-mode', 'crown-mode', 'doro-mode');
            document.body.classList.add(`${type}-mode`);
            document.getElementById('logo-box').classList.add('clickable');

            fetchImage(type);
            showToast(`${type.toUpperCase()} 테마 적용`);
        }

        function resetTheme() {
            document.body.classList.remove('siren-mode', 'crown-mode', 'doro-mode');
            document.getElementById('logo-box').classList.remove('clickable');
            document.getElementById('profile-img').style.display = 'none';
            document.getElementById('profile-initial').style.display = 'block';
            showToast(TRANSLATIONS[currentLang].reset);
        }

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.toggle('active', btn.id === `btn-${lang}`));
            const t = TRANSLATIONS[lang];
            document.getElementById('name-main').textContent = t.nameMain;
            document.getElementById('name-sub').textContent = t.nameSub;
            document.getElementById('job-title').textContent = t.job;
            document.getElementById('btn-text').textContent = t.btn;
            document.getElementById('label-mobile').textContent = t.mobile;
            document.getElementById('label-email').textContent = t.email;
            document.getElementById('address-text').textContent = t.address;
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.textContent = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 3000);
        }

        function downloadVCard() {
            const vCardData = [
                "BEGIN:VCARD", "VERSION:3.0",
                "N;CHARSET=UTF-8:하;지원;;;",
                "FN;CHARSET=UTF-8:하지원 (Jiwon Ha)",
                "ORG;CHARSET=UTF-8:(주)메가메디칼",
                "TITLE;CHARSET=UTF-8:영업기획팀 사원",
                "TEL;TYPE=CELL:010-0000-0000",
                "EMAIL:jwha@megamedical.co.kr",
                "ADR;TYPE=WORK;CHARSET=UTF-8:;;서울특별시 강남구 봉은사로 439 (CC빌딩 5층);;;;",
                "END:VCARD"
            ].join("\r\n");
            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'Jiwon_Ha.vcf';
            a.click();
        }
    </script>
</body>
</html>
